<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Utilería JS - Formulario</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main class="contenedor">
    <nav>
      <a href="login.html">Ir al login</a>
    </nav>

    <section class="tarjeta">
      <h1>Formulario de registro</h1>
      <p>
        Este formulario utiliza la librería <strong>utileria.js</strong> para
        validar datos y calcular la edad.
      </p>

      <form id="registroForm" novalidate>
        <div class="campo">
          <label for="nombre">Nombre completo</label>
          <input id="nombre" type="text" placeholder="Ej. María López" />
        </div>

        <div class="campo">
          <label for="correo">Correo electrónico</label>
          <input id="correo" type="email" placeholder="persona@correo.com" />
        </div>

        <div class="campo">
          <label for="telefono">Teléfono</label>
          <input id="telefono" type="text" placeholder="Ej. 951 123 4567" />
          <div class="ayuda">Máximo 10 dígitos.</div>
        </div>

        <div class="campo">
          <label for="fechaNacimiento">Fecha de nacimiento</label>
          <input id="fechaNacimiento" type="date" />
        </div>

        <div class="campo">
          <label for="password">Contraseña</label>
          <input id="password" type="password" placeholder="Mínimo 8 caracteres" />
          <div class="ayuda">
            Debe incluir mayúscula, minúscula, número y carácter especial.
          </div>
        </div>

        <button type="submit">Validar formulario</button>
        <div id="mensaje" class="mensaje"></div>
      </form>
    </section>
  </main>

  <div id="modalEdad" class="modal" role="dialog" aria-modal="true" aria-labelledby="tituloModal">
    <div class="modal-contenido">
      <h2 id="tituloModal">Edad calculada</h2>
      <p id="resultadoEdad"></p>
      <button id="cerrarModal" class="cerrar" type="button">Cerrar</button>
    </div>
  </div>

  <script src="js/utileria.js"></script>
  <script>
    const form = document.getElementById("registroForm");
    const mensaje = document.getElementById("mensaje");
    const modal = document.getElementById("modalEdad");
    const resultadoEdad = document.getElementById("resultadoEdad");
    const cerrarModal = document.getElementById("cerrarModal");

    function mostrarMensaje(texto, tipo) {
      mensaje.textContent = texto;
      mensaje.className = "mensaje " + tipo;
    }

    function abrirModal(edad) {
      resultadoEdad.textContent = `La edad calculada es ${edad} años.`;
      modal.classList.add("activo");
    }

    function ocultarModal() {
      modal.classList.remove("activo");
    }

    cerrarModal.addEventListener("click", ocultarModal);

    modal.addEventListener("click", (evento) => {
      if (evento.target === modal) {
        ocultarModal();
      }
    });

    form.addEventListener("submit", (evento) => {
      evento.preventDefault();

      const nombre = capitalizarNombre(document.getElementById("nombre").value);
      const correo = document.getElementById("correo").value.trim();
      const telefono = limpiarTelefono(document.getElementById("telefono").value);
      const fechaNacimiento = document.getElementById("fechaNacimiento").value;
      const password = document.getElementById("password").value;

      document.getElementById("nombre").value = nombre;
      document.getElementById("telefono").value = telefono;

      if (!soloLetras(nombre)) {
        mostrarMensaje("El nombre solo puede contener letras y espacios.", "error");
        return;
      }

      if (!validarCorreo(correo)) {
        mostrarMensaje("El correo electrónico no tiene un formato válido.", "error");
        return;
      }

      if (!validarLongitud(telefono, 10) || telefono.length !== 10) {
        mostrarMensaje("El teléfono debe contener exactamente 10 dígitos.", "error");
        return;
      }

      const edad = calcularEdad(fechaNacimiento);

      if (edad < 0) {
        mostrarMensaje("Selecciona una fecha de nacimiento válida.", "error");
        return;
      }

      if (!esMayorDeEdad(fechaNacimiento)) {
        mostrarMensaje("Para registrarte debes ser mayor de edad.", "error");
        abrirModal(edad);
        return;
      }

      if (!validarPassword(password)) {
        mostrarMensaje(
          "La contraseña debe tener 8 caracteres o más, mayúscula, minúscula, número y carácter especial.",
          "error"
        );
        return;
      }

      mostrarMensaje("Todos los datos son válidos.", "exito");
      abrirModal(edad);

      console.log("Registro validado:");
      console.log("Nombre:", nombre);
      console.log("Correo válido:", validarCorreo(correo));
      console.log("Teléfono:", telefono);
      console.log("Edad:", edad);
      console.log("Mayor de edad:", esMayorDeEdad(fechaNacimiento));
      console.log("Password válida:", validarPassword(password));
    });
  </script>
</body>
</html>
